[program:steamstorebd-queue]
process_name=%(program_name)s_%(process_num)02d
; --queue order is a priority, not a list: the worker empties `default`
; before it looks at `campaigns`, so a bulk send can never leave someone
; waiting for the code they just paid for.
command=php /var/www/steamstorebd/artisan queue:work --queue=default,campaigns --sleep=3 --tries=3 --max-time=3600
directory=/var/www/steamstorebd
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/steamstorebd/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; The price watch, on a worker of its own.
;
; Not folded into the worker above: a sweep holds whichever worker picks it
; up for minutes at a time, and that worker's queue carries the e-mail that
; delivers the codes a customer has just paid for. Queue priority decides
; what is picked up next, not what is interrupted -- so sharing the worker
; would mean a customer waiting on a price check, which is the thing the
; --queue order above exists to prevent.
[program:steamstorebd-pricewatch]
process_name=%(program_name)s
command=php /var/www/steamstorebd/artisan queue:work --queue=price-watch --sleep=5 --tries=1 --max-time=3600
directory=/var/www/steamstorebd
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/steamstorebd/storage/logs/price-watch-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; A sweep part-way through is better finished than killed; it is bounded by
; the job's own timeout.
stopwaitsecs=1800

[program:steamstorebd-scheduler]
process_name=%(program_name)s
command=php /var/www/steamstorebd/artisan schedule:work
directory=/var/www/steamstorebd
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/steamstorebd/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
